<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue 3 Performance Benchmark</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
    .version-badge { display: inline-block; background: #42b883; color: #fff; padding: 4px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; margin-bottom: 16px; }
    .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
    .tab { padding: 8px 16px; border: 1px solid #333; background: #16213e; color: #aaa; cursor: pointer; border-radius: 6px 6px 0 0; font-size: 13px; transition: all 0.2s; }
    .tab:hover { background: #1a1a4e; color: #fff; }
    .tab.active { background: #0f3460; color: #42b883; border-color: #42b883; }
    .panel { background: #16213e; border: 1px solid #333; border-radius: 0 8px 8px 8px; padding: 20px; min-height: 400px; }
    .controls { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
    .btn-primary { background: #42b883; color: #fff; }
    .btn-primary:hover { background: #379a6e; }
    .btn-secondary { background: #0f3460; color: #e0e0e0; border: 1px solid #444; }
    .btn-secondary:hover { background: #1a1a4e; }
    .btn-active { outline: 2px solid #42b883; outline-offset: -2px; background: #0a2e1e !important; color: #42b883 !important; }
    .metrics { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .metric { background: #0f3460; border-radius: 8px; padding: 12px 16px; min-width: 140px; }
    .metric-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .metric-value { font-size: 24px; font-weight: 700; color: #42b883; margin-top: 4px; }
    .metric-unit { font-size: 12px; color: #666; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #0f3460; padding: 8px 12px; text-align: left; position: sticky; top: 0; }
    td { padding: 6px 12px; border-bottom: 1px solid #222; }
    tr:hover td { background: #1a1a3e; }
    .table-wrap { max-height: 350px; overflow-y: auto; border-radius: 6px; border: 1px solid #333; }
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
    .dashboard-card { background: #0f3460; border-radius: 8px; padding: 10px; transition: background 0.1s; }
    .dashboard-card.warning { background: #2a1a0e; }
    .dashboard-card.critical { background: #2a0e0e; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .card-header .label { font-size: 11px; color: #ccc; font-weight: 600; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-dot.normal { background: #4fc08d; }
    .status-dot.warning { background: #f39c12; }
    .status-dot.critical { background: #e94560; }
    .stat-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; font-size: 11px; }
    .stat-row .stat-label { color: #666; width: 30px; }
    .stat-row .stat-value { color: #ccc; width: 42px; text-align: right; font-weight: 600; font-size: 12px; }
    .mini-bar { flex: 1; height: 4px; background: #1a1a2e; border-radius: 2px; overflow: hidden; }
    .mini-bar div { height: 100%; border-radius: 2px; transition: none; }
    .sparkline { display: flex; align-items: flex-end; gap: 1px; height: 24px; margin-top: 6px; }
    .spark-bar { flex: 1; background: #42b883; border-radius: 1px; opacity: 0.7; min-width: 0; }
    .tree-node { padding-left: 20px; border-left: 1px solid #333; margin-left: 8px; }
    .tree-item { padding: 3px 8px; margin: 2px 0; background: #0f3460; border-radius: 4px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
    .tree-item .count { color: #42b883; font-weight: 600; min-width: 32px; text-align: right; }
    .tree-item .count.count-high { color: #f39c12; }
    .tree-icon { font-size: 10px; margin-right: 4px; }
    .tree-label { color: #ccc; }
    .tree-sep { color: #333; margin: 0 6px; }
    .tree-badge { font-size: 9px; color: #555; background: #1a1a2e; padding: 1px 5px; border-radius: 3px; margin-left: 6px; }
    .tree-meta { font-size: 9px; color: #444; margin-left: 4px; }
    .progress-bar { height: 4px; background: #333; border-radius: 2px; overflow: hidden; margin-top: 8px; }
    .progress-fill { height: 100%; background: #42b883; transition: width 0.3s; }
    .log { background: #0a0a1a; border: 1px solid #333; border-radius: 6px; padding: 12px; max-height: 120px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 12px; margin-top: 12px; }
    .log-entry { padding: 2px 0; border-bottom: 1px solid #111; }
    .log-time { color: #42b883; }
    .log-msg { color: #aaa; }
    .heavy-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 11px; color: #888; }
    .form-group input, .form-group select { background: #0a0a1a; border: 1px solid #333; color: #e0e0e0; padding: 8px; border-radius: 4px; font-size: 13px; }
    .bundle-demo { text-align: center; padding: 40px 20px; }
    .bundle-size { font-size: 48px; font-weight: 700; color: #42b883; }
    .bundle-breakdown { display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
    .bundle-item { background: #0f3460; padding: 12px 20px; border-radius: 8px; }
    .bundle-item .size { font-size: 18px; font-weight: 600; color: #42b883; }
    .bundle-item .name { font-size: 11px; color: #888; margin-top: 4px; }
    .highlight { color: #42b883; }
    .warning { color: #e94560; }
    .good { color: #42b883; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const { createApp, ref, reactive, computed, nextTick, onBeforeUnmount, shallowRef, triggerRef } = Vue;

    // Tree Node Component — rich template with lots of static content
    // Vue 3 optimization: static nodes are hoisted & reused, patch flags skip them during diff
    // Vue 2 must diff ALL nodes (static + dynamic) every render
    const TreeNode = {
      name: 'TreeNode',
      props: ['node'],
      template: `
        <div class="tree-wrapper">
          <div class="tree-item">
            <span class="tree-icon">&#128193;</span>
            <span class="tree-label">{{ node.label }}</span>
            <span class="tree-sep">|</span>
            <span class="count" :class="{ 'count-high': node.count > 50 }">{{ node.count }}</span>
            <span class="tree-badge">node</span>
            <span class="tree-meta">id:{{ node.id }}</span>
          </div>
          <div class="tree-node" v-if="node.children?.length">
            <TreeNode v-for="child in node.children" :key="child.id" :node="child" />
          </div>
        </div>
      `
    };

    const names = ['Alice', 'Bob', 'Charlie', 'Diana', 'Eve', 'Frank', 'Grace', 'Hank', 'Ivy', 'Jack', 'Kate', 'Leo', 'Mia', 'Nick', 'Olivia', 'Paul', 'Quinn', 'Rose', 'Sam', 'Tina'];
    const statuses = ['Active', 'Inactive', 'Pending', 'Suspended'];
    const colors = ['#e94560', '#4fc08d', '#3498db', '#f39c12', '#9b59b6', '#1abc9c'];

    function randomName() { return names[Math.floor(Math.random() * names.length)]; }
    function randomScore() { return Math.floor(Math.random() * 100); }

    const app = createApp({
      components: { TreeNode },
      setup() {
        const currentTab = ref('list');
        const lastAction = ref('');
        const logs = ref([]);

        function addLog(msg) {
          const now = new Date();
          const time = now.toLocaleTimeString('en-US', { hour12: false }) + '.' + String(now.getMilliseconds()).padStart(3, '0');
          logs.value.unshift({ time, msg });
          if (logs.value.length > 50) logs.value.length = 50;
          window.parent.postMessage({ type: 'vue3-metric', tab: currentTab.value, msg }, '*');
        }

        // === Test 1: Large List ===
        // Vue 3: Use shallowRef for large arrays — avoids deep reactive overhead
        const listItems = shallowRef([]);
        const listMetrics = reactive({ create: '-', update: '-' });

        function listCreate(count) {
          const start = performance.now();
          const items = [];
          for (let i = 0; i < count; i++) {
            items.push({
              id: i + 1,
              name: randomName() + ' ' + randomName(),
              email: randomName().toLowerCase() + i + '@example.com',
              score: randomScore(),
              status: statuses[i % 4],
              highlight: false
            });
          }
          listItems.value = items;
          nextTick(() => {
            const elapsed = Math.round(performance.now() - start);
            listMetrics.create = elapsed;
            addLog(`Created ${count} rows in ${elapsed}ms`);
          });
        }

        function listUpdateEvery10th() {
          const start = performance.now();
          const items = listItems.value;
          for (let i = 0; i < items.length; i += 10) {
            // Vue 3: Proxy-based reactivity — direct mutation works with triggerRef
            items[i].score = randomScore();
            items[i].name = items[i].name + ' !!!';
            items[i].highlight = true;
          }
          triggerRef(listItems);
          nextTick(() => {
            const elapsed = Math.round(performance.now() - start);
            listMetrics.update = elapsed;
            addLog(`Updated every 10th row in ${elapsed}ms`);
          });
        }

        function listSwapRows() {
          const start = performance.now();
          const items = listItems.value;
          const tmp = items[1];
          items[1] = items[998];
          items[998] = tmp;
          triggerRef(listItems);
          nextTick(() => {
            const elapsed = Math.round(performance.now() - start);
            listMetrics.update = elapsed;
            addLog(`Swapped rows 1 & 998 in ${elapsed}ms`);
          });
        }

        function listAppend1000() {
          const start = performance.now();
          const base = listItems.value.length;
          for (let i = 0; i < 1000; i++) {
            listItems.value.push({
              id: base + i + 1,
              name: randomName() + ' ' + randomName(),
              email: randomName().toLowerCase() + (base + i) + '@example.com',
              score: randomScore(),
              status: statuses[i % 4],
              highlight: false
            });
          }
          triggerRef(listItems);
          nextTick(() => {
            const elapsed = Math.round(performance.now() - start);
            listMetrics.update = elapsed;
            addLog(`Appended 1000 rows in ${elapsed}ms`);
          });
        }

        function listClear() {
          const start = performance.now();
          listItems.value = [];
          nextTick(() => {
            const elapsed = Math.round(performance.now() - start);
            listMetrics.update = elapsed;
            addLog(`Cleared all rows in ${elapsed}ms`);
          });
        }

        // === Test 2: Dashboard ===
        // Vue 3: deep ref — Proxy tracks each card.stats.cpu.current individually
        // Only components reading changed properties re-render (fine-grained)
        const dashCards = ref([]);
        const dashRunning = ref(false);
        const dashCardCount = ref(200);
        const dashMetrics = reactive({ avgUpdate: '-', totalUpdates: 0, droppedFrames: 0, fps: '-' });
        let dashRafId = null;
        let dashUpdateTimes = [];

        function dashCreateCard(i) {
          const history = [];
          for (let h = 0; h < 12; h++) history.push(Math.floor(Math.random() * 100));
          return {
            id: i,
            label: 'Server-' + i,
            color: colors[i % colors.length],
            status: 'normal',
            stats: {
              cpu: { current: Math.floor(Math.random() * 100), peak: 0, avg: 0 },
              memory: { used: Math.floor(Math.random() * 8192), total: 8192, percent: 0 },
              network: { in: Math.floor(Math.random() * 1000), out: Math.floor(Math.random() * 500), latency: Math.floor(Math.random() * 100) },
              disk: { read: Math.floor(Math.random() * 500), write: Math.floor(Math.random() * 300), iops: Math.floor(Math.random() * 1000) }
            },
            history: history
          };
        }

        function dashStart() {
          dashStop();
          const cards = [];
          for (let i = 0; i < dashCardCount.value; i++) {
            cards.push(dashCreateCard(i));
          }
          dashCards.value = cards;
          dashRunning.value = true;
          Object.assign(dashMetrics, { avgUpdate: '-', totalUpdates: 0, droppedFrames: 0, fps: '-' });
          dashUpdateTimes = [];
          let lastFrameTime = performance.now();
          let fpsFrames = 0;
          let fpsLastTime = performance.now();

          function tick() {
            const start = performance.now();
            const arr = dashCards.value;
            // Update 80% of cards — Vue 3: direct mutation on shallowRef items
            const updateCount = Math.floor(arr.length * 0.8);
            for (let j = 0; j < updateCount; j++) {
              const idx = Math.floor(Math.random() * arr.length);
              const card = arr[idx];
              // Vue 3: directly mutate nested properties — Proxy tracks lazily
              const newCpu = Math.floor(Math.random() * 100);
              card.stats.cpu.current = newCpu;
              card.stats.cpu.peak = Math.max(card.stats.cpu.peak, newCpu);
              card.stats.cpu.avg = Math.round((card.stats.cpu.avg * 0.9) + (newCpu * 0.1));
              const newMemUsed = Math.floor(Math.random() * 8192);
              card.stats.memory.used = newMemUsed;
              card.stats.memory.percent = Math.round(newMemUsed / 8192 * 100);
              card.stats.network.in = Math.floor(Math.random() * 1000);
              card.stats.network.out = Math.floor(Math.random() * 500);
              card.stats.network.latency = Math.floor(Math.random() * 120);
              card.stats.disk.read = Math.floor(Math.random() * 500);
              card.stats.disk.write = Math.floor(Math.random() * 300);
              card.stats.disk.iops = Math.floor(Math.random() * 1000);
              // Shift history and add new point
              card.history.shift();
              card.history.push(newCpu);
              // Determine status
              card.status = newCpu > 90 || card.stats.memory.percent > 90
                ? 'critical'
                : (newCpu > 70 || card.stats.memory.percent > 75 ? 'warning' : 'normal');
            }
            // Vue 3: NO triggerRef needed — Proxy detects each mutation automatically
            // Vue 3 scheduler batches all triggered effects into a single render cycle
            nextTick(() => {
              const elapsed = performance.now() - start;
              dashUpdateTimes.push(elapsed);
              if (dashUpdateTimes.length > 60) dashUpdateTimes.shift();
              dashMetrics.totalUpdates++;
              dashMetrics.avgUpdate = Math.round(
                dashUpdateTimes.reduce((a, b) => a + b, 0) / dashUpdateTimes.length
              );
              const now = performance.now();
              if (now - lastFrameTime > 32) {
                dashMetrics.droppedFrames++;
              }
              lastFrameTime = now;
              // FPS calculation
              fpsFrames++;
              if (now - fpsLastTime >= 1000) {
                dashMetrics.fps = fpsFrames;
                fpsFrames = 0;
                fpsLastTime = now;
              }
            });
            if (dashRunning.value) {
              dashRafId = requestAnimationFrame(tick);
            }
          }
          dashRafId = requestAnimationFrame(tick);
          addLog(`Dashboard started: ${dashCardCount.value} cards, rAF loop, 80% update, nested objects`);
        }

        function dashStop() {
          if (dashRafId) { cancelAnimationFrame(dashRafId); dashRafId = null; }
          dashRunning.value = false;
          if (dashMetrics.totalUpdates > 0) {
            addLog(`Dashboard stopped. Avg: ${dashMetrics.avgUpdate}ms, Dropped: ${dashMetrics.droppedFrames}, FPS: ${dashMetrics.fps}`);
          }
        }

        // === Test 3: Tree ===
        // Use ref() (NOT shallowRef) — Vue 3's Proxy deeply tracks node.count changes
        // This is the correct Vue 3 pattern: Proxy-based lazy tracking
        // vs Vue 2's Object.defineProperty recursive walk at init time
        const treeData = ref([]);
        const treeMetrics = reactive({ generate: '-', update: '-' });
        const treeNodeCount = ref(0);

        function treeGenerate(depth, children) {
          const start = performance.now();
          let nodeId = 0;
          let count = 0;
          const buildTree = (level, prefix) => {
            if (level === 0) return [];
            const nodes = [];
            for (let i = 0; i < children; i++) {
              nodeId++;
              count++;
              nodes.push({
                id: nodeId,
                label: prefix + '-' + i,
                count: Math.floor(Math.random() * 100),
                children: buildTree(level - 1, prefix + '-' + i)
              });
            }
            return nodes;
          };
          treeData.value = buildTree(depth, 'Node');
          treeNodeCount.value = count;
          nextTick(() => {
            const elapsed = Math.round(performance.now() - start);
            treeMetrics.generate = elapsed;
            addLog(`Generated tree: ${depth} levels x ${children} children = ${count} nodes in ${elapsed}ms`);
          });
        }

        function treeUpdateAll() {
          const start = performance.now();
          // Vue 3: direct mutation — Proxy automatically detects n.count changes
          // Only components reading the mutated property re-render
          const walk = (nodes) => {
            nodes.forEach(n => {
              n.count = (n.count || 0) + 1; // increment to make changes visually obvious
              if (n.children) walk(n.children);
            });
          };
          walk(treeData.value);
          nextTick(() => {
            const elapsed = Math.round(performance.now() - start);
            treeMetrics.update = elapsed;
            addLog(`Updated all ${treeNodeCount.value} tree nodes in ${elapsed}ms`);
          });
        }

        function treeUpdateDeep() {
          const start = performance.now();
          const walkDeep = (nodes) => {
            nodes.forEach(n => {
              if (!n.children || n.children.length === 0) {
                n.count = (n.count || 0) + 10; // larger increment for leaf nodes
              } else {
                walkDeep(n.children);
              }
            });
          };
          walkDeep(treeData.value);
          nextTick(() => {
            const elapsed = Math.round(performance.now() - start);
            treeMetrics.update = elapsed;
            addLog(`Updated deepest leaf nodes in ${elapsed}ms`);
          });
        }

        // Vue 3 advantage: only 10% of components re-render (fine-grained Proxy tracking)
        // vs Vue 2 which replaces the array and diffs the entire tree
        function treeUpdate10Pct() {
          const start = performance.now();
          let updated = 0;
          const walk = (nodes) => {
            nodes.forEach(n => {
              if (Math.random() < 0.1) {
                n.count = (n.count || 0) + 5;
                updated++;
              }
              if (n.children) walk(n.children);
            });
          };
          walk(treeData.value);
          nextTick(() => {
            const elapsed = Math.round(performance.now() - start);
            treeMetrics.update = elapsed;
            addLog(`Updated ${updated}/${treeNodeCount.value} (10%) tree nodes in ${elapsed}ms`);
          });
        }

        // === Test 4: Heavy Init ===
        const heavyFields = shallowRef([]);
        const heavyMetrics = reactive({ init: '-', update: '-' });
        const heavySum = computed(() => {
          return heavyFields.value.reduce((sum, f) => sum + (f.value || 0), 0);
        });

        function heavyInit(count) {
          const start = performance.now();
          const fields = [];
          for (let i = 0; i < count; i++) {
            fields.push({
              id: i,
              label: 'Field-' + i,
              value: Math.floor(Math.random() * 100),
              computed: 0
            });
          }
          fields.forEach(f => {
            f.computed = f.value * 2 + Math.floor(f.value / 3);
          });
          heavyFields.value = fields;
          nextTick(() => {
            const elapsed = Math.round(performance.now() - start);
            heavyMetrics.init = elapsed;
            addLog(`Initialized ${count} form fields in ${elapsed}ms`);
          });
        }

        function heavyOnInput(field) {
          field.computed = field.value * 2 + Math.floor(field.value / 3);
          triggerRef(heavyFields);
        }

        function heavyUpdateAll() {
          const start = performance.now();
          heavyFields.value.forEach(f => {
            f.value = Math.floor(Math.random() * 100);
            f.computed = f.value * 2 + Math.floor(f.value / 3);
          });
          triggerRef(heavyFields);
          nextTick(() => {
            const elapsed = Math.round(performance.now() - start);
            heavyMetrics.update = elapsed;
            addLog(`Updated all ${heavyFields.value.length} fields in ${elapsed}ms`);
          });
        }

        onBeforeUnmount(() => { dashStop(); });

        // Listen for sync actions from parent
        window.addEventListener('message', (e) => {
          if (!e.data || e.data.type !== 'sync-action') return;
          const action = e.data.action;
          if (action === 'switch-tab') { currentTab.value = e.data.tab; return; }
          lastAction.value = action;
          switch (action) {
            case 'list-create-10k': listCreate(10000); break;
            case 'list-create-50k': listCreate(50000); break;
            case 'list-update-10th': listUpdateEvery10th(); break;
            case 'list-swap': listSwapRows(); break;
            case 'list-append': listAppend1000(); break;
            case 'list-clear': listClear(); break;
            case 'dash-start-200': dashCardCount.value = 200; nextTick(() => dashStart()); break;
            case 'dash-start-500': dashCardCount.value = 500; nextTick(() => dashStart()); break;
            case 'dash-start-1000': dashCardCount.value = 1000; nextTick(() => dashStart()); break;
            case 'dash-stop': dashStop(); break;
            case 'tree-5x6': treeGenerate(5, 6); break;
            case 'tree-8x4': treeGenerate(8, 4); break;
            case 'tree-10x3': treeGenerate(10, 3); break;
            case 'tree-update-all': treeUpdateAll(); break;
            case 'tree-update-10pct': treeUpdate10Pct(); break;
            case 'tree-update-deep': treeUpdateDeep(); break;
            case 'heavy-200': heavyInit(200); break;
            case 'heavy-500': heavyInit(500); break;
            case 'heavy-1000': heavyInit(1000); break;
            case 'heavy-update': heavyUpdateAll(); break;
          }
        });

        return {
          currentTab, lastAction, logs, addLog,
          listItems, listMetrics, listCreate, listUpdateEvery10th, listSwapRows, listAppend1000, listClear,
          dashCards, dashRunning, dashCardCount, dashMetrics, dashStart, dashStop,
          treeData, treeMetrics, treeNodeCount, treeGenerate, treeUpdateAll, treeUpdateDeep, treeUpdate10Pct,
          heavyFields, heavyMetrics, heavySum, heavyInit, heavyOnInput, heavyUpdateAll
        };
      },
      template: `
        <div>
          <span class="version-badge">Vue 3.4</span>

          <div class="tabs">
            <div class="tab" :class="{ active: currentTab === 'list' }" @click="currentTab = 'list'">1. Large List</div>
            <div class="tab" :class="{ active: currentTab === 'dashboard' }" @click="currentTab = 'dashboard'">2. Dashboard</div>
            <div class="tab" :class="{ active: currentTab === 'tree' }" @click="currentTab = 'tree'">3. Deep Nesting</div>
            <div class="tab" :class="{ active: currentTab === 'heavy' }" @click="currentTab = 'heavy'">4. Heavy Init</div>
            <div class="tab" :class="{ active: currentTab === 'bundle' }" @click="currentTab = 'bundle'">5. Bundle Size</div>
          </div>

          <!-- Test 1: Large List -->
          <div class="panel" v-if="currentTab === 'list'">
            <h3 style="margin-bottom: 12px;">Large List Rendering & Update (v-for / table)</h3>
            <div class="controls">
              <button class="btn btn-primary" :class="{ 'btn-active': lastAction === 'list-create-10k' }" @click="lastAction = 'list-create-10k'; listCreate(10000)">Create 10,000 rows</button>
              <button class="btn btn-secondary" :class="{ 'btn-active': lastAction === 'list-create-50k' }" @click="lastAction = 'list-create-50k'; listCreate(50000)">Create 50,000 rows</button>
              <button class="btn btn-secondary" :class="{ 'btn-active': lastAction === 'list-update-10th' }" @click="lastAction = 'list-update-10th'; listUpdateEvery10th()" :disabled="!listItems.length">Update every 10th</button>
              <button class="btn btn-secondary" :class="{ 'btn-active': lastAction === 'list-swap' }" @click="lastAction = 'list-swap'; listSwapRows()" :disabled="listItems.length < 1000">Swap rows</button>
              <button class="btn btn-secondary" :class="{ 'btn-active': lastAction === 'list-append' }" @click="lastAction = 'list-append'; listAppend1000()" :disabled="!listItems.length">Append 1,000</button>
              <button class="btn btn-secondary" :class="{ 'btn-active': lastAction === 'list-clear' }" @click="lastAction = 'list-clear'; listClear()" :disabled="!listItems.length">Clear</button>
            </div>
            <div class="metrics">
              <div class="metric">
                <div class="metric-label">Create Time</div>
                <div class="metric-value">{{ listMetrics.create }}<span class="metric-unit">ms</span></div>
              </div>
              <div class="metric">
                <div class="metric-label">Update Time</div>
                <div class="metric-value">{{ listMetrics.update }}<span class="metric-unit">ms</span></div>
              </div>
              <div class="metric">
                <div class="metric-label">Total Rows</div>
                <div class="metric-value">{{ listItems.length }}</div>
              </div>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th style="width:60px">#</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Score</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-for="item in listItems" :key="item.id" :class="{ highlight: item.highlight }">
                    <td>{{ item.id }}</td>
                    <td>{{ item.name }}</td>
                    <td>{{ item.email }}</td>
                    <td :style="{ color: item.score > 80 ? '#4fc08d' : item.score < 40 ? '#e94560' : '#e0e0e0' }">{{ item.score }}</td>
                    <td>{{ item.status }}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- Test 2: Dashboard -->
          <div class="panel" v-if="currentTab === 'dashboard'">
            <h3 style="margin-bottom: 12px;">Real-time Dashboard (Deep Nested Reactive Updates)</h3>
            <div class="controls">
              <button class="btn btn-primary" :class="{ 'btn-active': lastAction === 'dash-start' }" @click="lastAction = 'dash-start'; dashStart()" :disabled="dashRunning">Start ({{ dashCardCount }} cards)</button>
              <button class="btn btn-secondary" :class="{ 'btn-active': lastAction === 'dash-stop' }" @click="lastAction = 'dash-stop'; dashStop()" :disabled="!dashRunning">Stop</button>
              <button class="btn btn-secondary" :class="{ 'btn-active': dashCardCount === 200 }" @click="dashCardCount = 200">200</button>
              <button class="btn btn-secondary" :class="{ 'btn-active': dashCardCount === 500 }" @click="dashCardCount = 500">500</button>
              <button class="btn btn-secondary" :class="{ 'btn-active': dashCardCount === 1000 }" @click="dashCardCount = 1000">1000</button>
              <span style="font-size:11px;color:#888;">80% updated/tick · rAF loop · nested objects</span>
            </div>
            <div class="metrics">
              <div class="metric">
                <div class="metric-label">Avg Update</div>
                <div class="metric-value">{{ dashMetrics.avgUpdate }}<span class="metric-unit">ms</span></div>
              </div>
              <div class="metric">
                <div class="metric-label">Total Updates</div>
                <div class="metric-value">{{ dashMetrics.totalUpdates }}</div>
              </div>
              <div class="metric">
                <div class="metric-label">Dropped Frames</div>
                <div class="metric-value warning">{{ dashMetrics.droppedFrames }}</div>
              </div>
              <div class="metric">
                <div class="metric-label">FPS</div>
                <div class="metric-value">{{ dashMetrics.fps }}</div>
              </div>
            </div>
            <div class="dashboard-grid">
              <div class="dashboard-card" v-for="card in dashCards" :key="card.id"
                   :class="card.status"
                   :style="{ borderLeft: '3px solid ' + card.color }">
                <div class="card-header">
                  <span class="label">{{ card.label }}</span>
                  <span class="status-dot" :class="card.status"></span>
                </div>
                <div class="stat-row">
                  <span class="stat-label">CPU</span>
                  <span class="stat-value" :style="{ color: card.stats.cpu.current > 80 ? '#e94560' : '#4fc08d' }">{{ card.stats.cpu.current }}%</span>
                  <div class="mini-bar"><div :style="{ width: card.stats.cpu.current + '%', background: card.stats.cpu.current > 80 ? '#e94560' : '#4fc08d' }"></div></div>
                </div>
                <div class="stat-row">
                  <span class="stat-label">MEM</span>
                  <span class="stat-value" :style="{ color: card.stats.memory.percent > 85 ? '#e94560' : '#3498db' }">{{ card.stats.memory.percent }}%</span>
                  <div class="mini-bar"><div :style="{ width: card.stats.memory.percent + '%', background: card.stats.memory.percent > 85 ? '#e94560' : '#3498db' }"></div></div>
                </div>
                <div class="stat-row">
                  <span class="stat-label">NET</span>
                  <span class="stat-value">{{ card.stats.network.latency }}ms</span>
                  <div class="mini-bar"><div :style="{ width: Math.min(card.stats.network.latency, 100) + '%', background: card.stats.network.latency > 80 ? '#f39c12' : '#1abc9c' }"></div></div>
                </div>
                <div class="stat-row">
                  <span class="stat-label">DSK</span>
                  <span class="stat-value">{{ card.stats.disk.iops }}</span>
                </div>
                <div class="sparkline">
                  <div class="spark-bar" v-for="(h, hi) in card.history" :key="hi"
                       :style="{ height: h + '%' }"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Test 3: Deep Nesting -->
          <div class="panel" v-if="currentTab === 'tree'">
            <h3 style="margin-bottom: 12px;">Deep Component Tree (Nested Reactivity)</h3>
            <div class="controls">
              <button class="btn btn-primary" :class="{ 'btn-active': lastAction === 'tree-5x6' }" @click="lastAction = 'tree-5x6'; treeGenerate(5, 6)">5 levels x 6 children</button>
              <button class="btn btn-secondary" :class="{ 'btn-active': lastAction === 'tree-8x4' }" @click="lastAction = 'tree-8x4'; treeGenerate(8, 4)">8 levels x 4 children</button>
              <button class="btn btn-secondary" :class="{ 'btn-active': lastAction === 'tree-10x3' }" @click="lastAction = 'tree-10x3'; treeGenerate(10, 3)">10 levels x 3 children</button>
              <button class="btn btn-secondary" :class="{ 'btn-active': lastAction === 'tree-update-all' }" @click="lastAction = 'tree-update-all'; treeUpdateAll()" :disabled="!treeData.length">Update All</button>
              <button class="btn btn-secondary" :class="{ 'btn-active': lastAction === 'tree-update-10pct' }" @click="lastAction = 'tree-update-10pct'; treeUpdate10Pct()" :disabled="!treeData.length">Update 10%</button>
              <button class="btn btn-secondary" :class="{ 'btn-active': lastAction === 'tree-update-deep' }" @click="lastAction = 'tree-update-deep'; treeUpdateDeep()" :disabled="!treeData.length">Update Leaves</button>
            </div>
            <div class="metrics">
              <div class="metric">
                <div class="metric-label">Generate</div>
                <div class="metric-value">{{ treeMetrics.generate }}<span class="metric-unit">ms</span></div>
              </div>
              <div class="metric">
                <div class="metric-label">Update</div>
                <div class="metric-value">{{ treeMetrics.update }}<span class="metric-unit">ms</span></div>
              </div>
              <div class="metric">
                <div class="metric-label">Total Nodes</div>
                <div class="metric-value">{{ treeNodeCount }}</div>
              </div>
            </div>
            <div style="max-height: 350px; overflow-y: auto; border: 1px solid #333; border-radius: 6px; padding: 8px;">
              <TreeNode v-for="node in treeData" :key="node.id" :node="node" />
            </div>
          </div>

          <!-- Test 4: Heavy Init -->
          <div class="panel" v-if="currentTab === 'heavy'">
            <h3 style="margin-bottom: 12px;">Heavy Page Initialization (Computed + Watchers + Forms)</h3>
            <div class="controls">
              <button class="btn btn-primary" :class="{ 'btn-active': lastAction === 'heavy-200' }" @click="lastAction = 'heavy-200'; heavyInit(200)">Init 200 Fields</button>
              <button class="btn btn-secondary" :class="{ 'btn-active': lastAction === 'heavy-500' }" @click="lastAction = 'heavy-500'; heavyInit(500)">Init 500 Fields</button>
              <button class="btn btn-secondary" :class="{ 'btn-active': lastAction === 'heavy-1000' }" @click="lastAction = 'heavy-1000'; heavyInit(1000)">Init 1000 Fields</button>
              <button class="btn btn-secondary" :class="{ 'btn-active': lastAction === 'heavy-update' }" @click="lastAction = 'heavy-update'; heavyUpdateAll()" :disabled="!heavyFields.length">Update All</button>
            </div>
            <div class="metrics">
              <div class="metric">
                <div class="metric-label">Init Time</div>
                <div class="metric-value">{{ heavyMetrics.init }}<span class="metric-unit">ms</span></div>
              </div>
              <div class="metric">
                <div class="metric-label">Update All</div>
                <div class="metric-value">{{ heavyMetrics.update }}<span class="metric-unit">ms</span></div>
              </div>
              <div class="metric">
                <div class="metric-label">Fields</div>
                <div class="metric-value">{{ heavyFields.length }}</div>
              </div>
              <div class="metric">
                <div class="metric-label">Computed Sum</div>
                <div class="metric-value">{{ heavySum }}</div>
              </div>
            </div>
            <div class="heavy-form" style="max-height: 300px; overflow-y: auto; border: 1px solid #333; border-radius: 6px; padding: 12px;">
              <div class="form-group" v-for="field in heavyFields" :key="field.id">
                <label>{{ field.label }} ({{ field.computed }})</label>
                <input :value="field.value" type="number" @input="e => { field.value = +e.target.value; heavyOnInput(field); }">
              </div>
            </div>
          </div>

          <!-- Test 5: Bundle Size -->
          <div class="panel" v-if="currentTab === 'bundle'">
            <h3 style="margin-bottom: 12px;">Bundle Size Comparison (Tree-shaking)</h3>
            <div class="bundle-demo">
              <p style="color: #888; margin-bottom: 20px;">Vue 3 supports tree-shaking — only import what you use</p>
              <div class="bundle-size">~16 KB</div>
              <p style="color: #888; margin-top: 8px;">min + gzip (tree-shaken runtime)</p>
              <div class="bundle-breakdown">
                <div class="bundle-item">
                  <div class="size">10.0 KB</div>
                  <div class="name">Core Runtime</div>
                </div>
                <div class="bundle-item">
                  <div class="size">6.0 KB</div>
                  <div class="name">Compiler</div>
                </div>
                <div class="bundle-item">
                  <div class="size good">~17 KB saved</div>
                  <div class="name">Tree-shaking</div>
                </div>
              </div>
              <div style="margin-top: 30px; text-align: left; background: #0a0a1a; padding: 16px; border-radius: 8px; font-size: 13px;">
                <p style="color: #42b883; font-weight: 600; margin-bottom: 8px;">Vue 3 Improvements:</p>
                <ul style="color: #aaa; padding-left: 20px; line-height: 1.8;">
                  <li><span class="good">Proxy-based</span> reactivity — lazy, no init walk, detects add/delete</li>
                  <li><span class="good">shallowRef / shallowReactive</span> — opt-out of deep reactivity</li>
                  <li><span class="good">Patch flags</span> — compiler marks dynamic bindings, skip static nodes</li>
                  <li><span class="good">Static hoisting</span> — static VNodes created once, reused across renders</li>
                  <li><span class="good">Tree-shaking</span> — unused features (transition, v-model) are dead-code eliminated</li>
                  <li><span class="good">Fragments</span> — multiple root elements, no wrapper div needed</li>
                  <li><span class="good">Composition API</span> — better code reuse, replaces mixins</li>
                  <li><span class="good">Block tree</span> — flat dynamic node tracking, O(dynamic) not O(total)</li>
                </ul>
              </div>
            </div>
          </div>

          <div class="log" v-if="logs.length">
            <div class="log-entry" v-for="(log, i) in logs" :key="i">
              <span class="log-time">[{{ log.time }}]</span>
              <span class="log-msg"> {{ log.msg }}</span>
            </div>
          </div>
        </div>
      `
    });

    app.mount('#app');
  </script>
</body>
</html>
